<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Store - Smart Stock & Money Manager</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e293b', 900: '#0f172a', 950: '#090d16' },
                        emerald: { 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 md:p-10">
        <div class="flex items-center gap-3 mb-6 pb-6 border-b border-slate-100">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="w-10 h-10 rounded-xl">
            <div>
                <h2 class="text-xl font-bold text-slate-800 font-heading">Register Your Retail Store</h2>
                <p class="text-xs text-slate-500">Create your digital store ledger and inventory master</p>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl mb-4 text-xs font-medium border {% if category == 'success' %}bg-emerald-50 text-emerald-800 border-emerald-200{% else %}bg-rose-50 text-rose-800 border-rose-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Shop / Store Name *</label>
                    <input type="text" name="shop_name" required placeholder="e.g. Balaji Provision Store"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Owner Full Name *</label>
                    <input type="text" name="owner_name" required placeholder="e.g. Mukesh Kumar"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Username *</label>
                    <input type="text" name="username" required placeholder="e.g. mukesh_store"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
                    <input type="email" name="email" required placeholder="e.g. mukesh@gmail.com"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile / WhatsApp Number *</label>
                    <input type="text" name="phone" required placeholder="e.g. +91 98765 00000"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">GSTIN / Udyam (Optional)</label>
                    <input type="text" name="gstin" placeholder="e.g. 24AAACP1234M1Z5"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Store Physical Address</label>
                <input type="text" name="address" placeholder="e.g. Shop #4, Station Road, Main Bazaar"
                       class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Password *</label>
                    <input type="password" name="password" required minlength="6" placeholder="At least 6 characters"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password *</label>
                    <input type="password" name="confirm_password" required minlength="6" placeholder="Re-type password"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow-md transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="store" class="w-4 h-4"></i>
                    <span>Create Store Account</span>
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Already registered?
            <a href="{{ url_for('login') }}" class="text-navy-900 font-bold hover:underline ml-1">Sign in here</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
